[workspace]
resolver = "2"
members = [
    "crates/tpt-sci-ode",
    "crates/tpt-sci-grid",
    "crates/tpt-sci-sim-core",
    "crates/tpt-sci-astro",
    "crates/tpt-sci-quantum",
    "crates/tpt-sci-image",
    "crates/tpt-sci-physics-rigid",
    "crates/tpt-sci-ppl",
    "crates/tpt-sci-reaction-network",
    "crates/tpt-sci-md",
    "crates/tpt-sci-dft-classical",
    "crates/tpt-sci-kinetics",
    "crates/tpt-sci-cfd-core",
    "crates/tpt-sci-hemodynamics",
    "crates/tpt-sci-electrophys",
    "crates/tpt-sci-climate",
    "crates/tpt-sci-ocean",
    "crates/tpt-sci-dft-electronic",
]
exclude = []

[workspace.package]
version = "0.1.0"
description = "tpt-science — simulation and modeling substrate for the TPT Solutions science verticals (ODE/DAE, structured-grid PDE, multi-scale orchestration, probabilistic programming, physics, quantum, imaging, astrodynamics)"
authors = ["TPT Solutions"]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/tpt-solutions/tpt-science"
repository = "https://github.com/tpt-solutions/tpt-science"

[workspace.dependencies]
# Cross-repo dependencies (tpt-math substrate), published on crates.io.
tpt-math-numeric = "0.1.0"
tpt-math-linalg = "0.1.0"
tpt-math-signal-fft = "0.1.0"
tpt-math-autodiff-rev = "0.1.0"
tpt-math-prob-bayes = "0.1.0"
tpt-math-prob-core = "0.1.0"
num-complex = "0.4"
# Wrap target for tpt-sci-dft-classical (classical/soft-matter DFT), MIT OR
# Apache-2.0. `feos` re-exports `feos-dft` plus the equation-of-state
# functionals (PC-SAFT, etc.) needed to build a concrete Helmholtz functional.
# Added by the 2026-08 spec2.txt expansion pass.
feos = { version = "0.10", default-features = false, features = ["dft"] }
# `feos-dft` provides the DFT machinery re-exported by `feos` under the `dft`
# feature; depend on it directly so `tpt-sci-dft-classical` can name the
# `feos_dft` crate path (MIT OR Apache-2.0).
feos-dft = { version = "0.10", default-features = false }

# In-repo crate dependencies (referenced by `workspace = true`).
tpt-sci-ode = { version = "0.1.0", path = "crates/tpt-sci-ode" }
tpt-sci-grid = { version = "0.1.0", path = "crates/tpt-sci-grid" }
tpt-sci-sim-core = { version = "0.1.0", path = "crates/tpt-sci-sim-core" }
tpt-sci-reaction-network = { version = "0.1.0", path = "crates/tpt-sci-reaction-network" }
tpt-sci-md = { version = "0.1.0", path = "crates/tpt-sci-md" }
tpt-sci-dft-classical = { version = "0.1.0", path = "crates/tpt-sci-dft-classical" }
tpt-sci-kinetics = { version = "0.1.0", path = "crates/tpt-sci-kinetics" }
tpt-sci-cfd-core = { version = "0.1.0", path = "crates/tpt-sci-cfd-core" }
tpt-sci-hemodynamics = { version = "0.1.0", path = "crates/tpt-sci-hemodynamics" }
tpt-sci-electrophys = { version = "0.1.0", path = "crates/tpt-sci-electrophys" }
tpt-sci-climate = { version = "0.1.0", path = "crates/tpt-sci-climate" }
tpt-sci-ocean = { version = "0.1.0", path = "crates/tpt-sci-ocean" }
tpt-sci-dft-electronic = { version = "0.1.0", path = "crates/tpt-sci-dft-electronic" }

# NOTE: `diffsol` is intentionally NOT a workspace dependency. `tpt-sci-ode`
# implements its own ODE solvers from scratch (dual-licensed, no Apache-only
# transitive deps). diffsol is used ONLY as an optional, dev-only verification
# oracle inside `tpt-sci-ode` (feature `verify-diffsol`, excluded from
# `cargo deny` via `include-dev = false`), never in the shipped graph.

# Shared external dev/build dependencies.
thiserror = "2"
anyhow = "1.0"
approx = "0.5"
# `criterion` is a benchmark dependency; listed here (not under a
# `[workspace.dev-dependencies]` table, which Cargo does not support for
# `workspace = true` inheritance) so crates can pull it into their
# `[dev-dependencies]` via `{ workspace = true }`.
criterion = "0.5"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
# JIT compilation (cranelift) in tpt-sci-ode requires unsafe for function pointer manipulation
unsafe_code = "allow"

[workspace.lints.clippy]
all = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
overflow-checks = true
