name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --all-features

  # Build the documentation and fail on any rustdoc warning (including broken
  # intra-doc links). This catches doc rot that `cargo test` only surfaces
  # indirectly via doctests.
  doc:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --workspace --no-deps --all-features

  # NOTE: intentionally NOT `cargo build --workspace --target thumbv6m-none-eabi`.
  # Per ADR 0001 (tpt-rust-map/docs/adr/0001-no-std-via-features-not-forks.md), a
  # blind --workspace no_std build breaks the moment any std-only crate joins
  # this repo. The science pillar is predominantly std-only (simulation, physics,
  # and quantum workloads do not typically run on bare-metal targets). Once a
  # crate is confirmed no_std, build it explicitly here with `-p`.
  no_std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi
      - run: |
          # No no_std crates in this pillar yet — nothing to build.
          echo "no crates yet — nothing to build"

  # Track line/branch coverage across the workspace with `cargo-llvm-cov` and
  # publish the lcov report as a build artifact (wire to Codecov by adding a
  # tokened `codecov/codecov-action` step when coverage gating is desired).
  coverage:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Generate coverage (lcov)
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info

  # Run the criterion benchmarks (see the `benches/` dirs). Timing is shrunk so
  # the job stays fast; run `cargo bench` locally for full measurements.
  benches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Run benchmarks
        run: cargo bench --workspace --benches -- --warm-up-time 0.5 --measurement-time 1 --sample-size 10

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # NOTE: v2 pins a cargo-deny built against a `rustsec` that understands
      # CVSS 4.0 severity strings. v1 fails to parse newer RUSTSEC advisories
      # with "unsupported CVSS version: 4.0" and aborts the whole check.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
