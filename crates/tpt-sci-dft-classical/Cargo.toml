[package]
name = "tpt-sci-dft-classical"
description = "Classical/soft-matter density functional theory (wraps feos/feos-dft), for the tpt-science pillar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/tpt-sci-dft-classical"
keywords = ["dft", "density-functional-theory", "pcsaft", "adsorption", "science"]
categories = ["science", "simulation", "chemistry"]
publish = false

[lib]
bench = false

[dependencies]
feos = { workspace = true }
feos-dft = { workspace = true }
thiserror = { workspace = true }
tpt-sci-grid = { workspace = true, features = ["sparse"] }

[dev-dependencies]
criterion = { workspace = true }
approx = { workspace = true }
# Dev-only: the `adsorption` example wraps a concrete PC-SAFT functional, which
# needs the `pcsaft` feature and `feos-core` (State / IdentifierOption).
feos = { workspace = true, features = ["pcsaft"] }
feos-core = "0.10"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[[bench]]
name = "square_gradient"
harness = false
