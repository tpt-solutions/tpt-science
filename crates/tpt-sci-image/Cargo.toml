[package]
name = "tpt-sci-image"
description = "n-dimensional image processing and tomographic reconstruction for the tpt-science pillar (built from scratch)"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/tpt-sci-image"
keywords = ["tomography", "image-processing", "radon", "science", "simulation"]
categories = ["science", "simulation"]

[lib]
bench = false

[dependencies]
tpt-math-linalg = { workspace = true }
tpt-math-signal-fft = { workspace = true }
thiserror = { workspace = true }
# Optional data parallelism over independent z slices in the 3-D CT path.
rayon = { version = "1", optional = true }

[dev-dependencies]
approx = { workspace = true }
criterion = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[[bench]]
name = "radon"
harness = false

[features]
# Parallel 3-D reconstruction (per z slice). Results are identical with or without it.
rayon = ["dep:rayon"]
