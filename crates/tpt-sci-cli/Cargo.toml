[package]
name = "tpt-sci-cli"
description = "Declarative runs of reaction networks from JSON specs, written as CSV (the `tpt-sci` command)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/tpt-sci-cli"
keywords = ["science", "simulation", "cli", "reaction-network"]
categories = ["science", "simulation", "command-line-utilities"]
publish = false

[lib]
bench = false

[[bin]]
name = "tpt-sci"
path = "src/main.rs"
bench = false

[dependencies]
# The runner needs only the closure solver, so the native-only JIT backend is off
# (this keeps the crate buildable for wasm32).
tpt-sci-ode = { path = "../tpt-sci-ode", default-features = false }
tpt-sci-reaction-network = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
