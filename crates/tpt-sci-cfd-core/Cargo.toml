[package]
name = "tpt-sci-cfd-core"
description = "Core incompressible Navier-Stokes finite-volume solver (from scratch) for the tpt-science pillar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/tpt-sci-cfd-core"
keywords = ["cfd", "navier-stokes", "finite-volume", "fluid", "science"]
categories = ["science", "simulation"]
publish = false

[dependencies]
tpt-math-linalg = { workspace = true }
tpt-sci-grid = { workspace = true, features = ["sparse"] }
thiserror = { workspace = true }

[dev-dependencies]
approx = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
