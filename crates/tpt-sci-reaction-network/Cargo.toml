[package]
name = "tpt-sci-reaction-network"
description = "Species/rate/stoichiometry DSL for compartmental models (Catalyst.jl-style), built from scratch, for the tpt-science pillar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/tpt-sci-reaction-network"
keywords = ["reaction-network", "systems-biology", "ode", "catalyst", "science"]
categories = ["science", "simulation"]
publish = false

[lib]
bench = false

[dependencies]
tpt-sci-ode = { workspace = true }
thiserror = { workspace = true }

# Optional (de)serialization of result types.
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1"
criterion = { workspace = true }
approx = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[[bench]]
name = "reaction_network"
harness = false

[features]
# serde (de)serialization for result types. Off by default.
serde = ["dep:serde"]

[[test]]
name = "serde_roundtrip"
required-features = ["serde"]
