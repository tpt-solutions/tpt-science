[package]
name = "tpt-sci-md"
description = "Classical molecular dynamics (Lennard-Jones, radial distribution function) for the tpt-science pillar"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/tpt-sci-md"
keywords = ["molecular-dynamics", "md", "lennard-jones", "rdf", "science"]
categories = ["science", "simulation"]

[lib]
bench = false

[dependencies]
num-complex = { workspace = true }
tpt-math-signal-fft = { workspace = true }
# Optional data parallelism over particles.
rayon = { version = "1", optional = true }
tpt-math-linalg = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
approx = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[[bench]]
name = "md"
harness = false

[features]
# Parallel Lennard-Jones forces (`Forces::lennard_jones_parallel`).
rayon = ["dep:rayon"]

[[test]]
name = "parallel_forces"
required-features = ["rayon"]
