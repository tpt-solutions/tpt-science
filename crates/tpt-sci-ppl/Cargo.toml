[package]
name = "tpt-sci-ppl"
description = "Probabilistic programming model/DSL and NUTS sampler for the tpt-science pillar (built from scratch)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/tpt-sci-ppl"
keywords = ["probabilistic", "bayesian", "nuts", "mcmc", "science"]
categories = ["science", "simulation", "mathematics"]

[lib]
bench = false

[dependencies]
tpt-math-linalg = { workspace = true }
tpt-math-autodiff-rev = { workspace = true }
tpt-math-prob-bayes = { workspace = true }
tpt-math-prob-core = { workspace = true }
thiserror = { workspace = true }
# Optional parallel chains (`gradient::fit_with_gradient_parallel`).
rayon = { version = "1", optional = true }

# Optional (de)serialization of result types.
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
tpt-sci-ode = { workspace = true }
criterion = { workspace = true }
approx = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[[bench]]
name = "ppl"
harness = false

[features]
# Run NUTS chains in parallel (`gradient::fit_with_gradient_parallel`).
rayon = ["dep:rayon"]
# serde (de)serialization for result types. Off by default.
serde = ["dep:serde"]

[[test]]
name = "parallel_chains"
required-features = ["rayon"]
