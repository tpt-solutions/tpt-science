[package]
name = "tpt-sci-ode"
description = "ODE/DAE solving for the tpt-science pillar (from-scratch, no diffsol)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/tpt-sci-ode"
keywords = ["ode", "dae", "diffeq", "science", "simulation"]
categories = ["science", "simulation", "mathematics"]

[lib]
bench = false

[dependencies]
tpt-math-numeric = { workspace = true }
thiserror = { workspace = true }

# Cranelift JIT compilation backend for DiffSL RHS codegen. Every cranelift
# crate is optional and enabled only by the `cranelift-jit` feature, so the
# JIT and its `unsafe` code can be compiled out entirely.
cranelift-codegen = { version = "0.135", features = ["host-arch"], optional = true }
cranelift-frontend = { version = "0.135", optional = true }
cranelift-module = { version = "0.135", optional = true }
cranelift-jit = { version = "0.135", optional = true }
cranelift-native = { version = "0.135", optional = true }
target-lexicon = { version = "0.13", optional = true }

# Optional verification oracle only (NOT shipped): compare our from-scratch
# trajectories against diffsol's on a battery of problems. It is a dev-only
# dependency gated behind the `verify-diffsol` feature and excluded from
# `cargo deny` license scanning (deny.toml `include-dev = false`), so it never
# taints the shipped, dual-licensed graph. Enable with `--features verify-diffsol`.
diffsol = { version = "0.16.1", default-features = false, features = ["faer"], optional = true }

[dev-dependencies]
approx = { workspace = true }
criterion = { workspace = true }

[features]
default = ["cranelift-jit"]
verify-diffsol = ["dep:diffsol"]
# Cranelift JIT backend (`jit` module). Disable with `--no-default-features`
# to build the closure-only solver with no cranelift or `unsafe` code.
cranelift-jit = [
    "dep:cranelift-codegen",
    "dep:cranelift-frontend",
    "dep:cranelift-module",
    "dep:cranelift-jit",
    "dep:cranelift-native",
    "dep:target-lexicon",
]

[lints]
workspace = true

[[bench]]
name = "solve"
harness = false

[[example]]
name = "van_der_pol"
required-features = ["cranelift-jit"]

[package.metadata.docs.rs]
all-features = true
