[package]
name = "tpt-sci-ode"
description = "ODE/DAE solving for the tpt-science pillar (wraps diffsol)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/tpt-sci-ode"
keywords = ["ode", "dae", "differential-equations", "science", "simulation"]
categories = ["science", "simulation", "mathematics"]
publish = false

[dependencies]
tpt-math-linalg = { workspace = true }
tpt-math-numeric = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }

# Optional verification oracle only (NOT shipped): compare our from-scratch
# trajectories against diffsol's on a battery of problems. Excluded from
# `cargo deny` license scanning (deny.toml `include-dev = false`), so it never
# taints the shipped, dual-licensed graph. Enable with `--features verify-diffsol`.
diffsol = { version = "0.16.1", default-features = false, features = ["faer"], optional = true }

[dev-dependencies]
approx = { workspace = true }
criterion = { workspace = true }

[features]
verify-diffsol = ["dep:diffsol"]

[lints]
workspace = true

[[bench]]
name = "solve"
harness = false

[package.metadata.docs.rs]
all-features = true
