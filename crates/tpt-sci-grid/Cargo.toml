[package]
name = "tpt-sci-grid"
description = "Structured finite-difference grids/stencils for the tpt-science pillar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/tpt-sci-grid"
keywords = ["finite-difference", "pde", "grid", "science", "simulation"]
categories = ["science", "simulation", "mathematics"]
publish = false

[lib]
bench = false

[dependencies]
tpt-math-numeric = { workspace = true }
tpt-math-linalg = { workspace = true }
thiserror = { workspace = true }

[features]
# Opt-in sparse-matrix backend (`CsrMatrix`, `laplacian_*_sparse`). additive:
# the dense API is always available; enabling this unlocks memory-efficient
# operators for realistically-sized (N-D) PDE grids.
sparse = []

[dev-dependencies]
approx = { workspace = true }
criterion = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[[bench]]
name = "laplacian"
harness = false
