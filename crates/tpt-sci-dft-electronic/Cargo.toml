[package]
name = "tpt-sci-dft-electronic"
description = "Simple 1-D electronic-structure DFT (Kohn-Sham LDA) from scratch, for the tpt-science pillar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/tpt-sci-dft-electronic"
keywords = ["dft", "electronic-structure", "kohn-sham", "lda", "science"]
categories = ["science", "simulation", "chemistry"]
publish = false

[dependencies]
tpt-math-linalg = { workspace = true }
tpt-sci-grid = { workspace = true, features = ["sparse"] }
thiserror = { workspace = true }

[dev-dependencies]
approx = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
