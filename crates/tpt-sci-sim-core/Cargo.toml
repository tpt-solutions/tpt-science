[package]
name = "tpt-sci-sim-core"
description = "Multi-scale simulation orchestration for the tpt-science pillar (time-stepping, cross-scale coupling, checkpointing)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/tpt-sci-sim-core"
keywords = ["simulation", "multi-scale", "orchestration", "science"]
categories = ["science", "simulation"]
publish = false

[lib]
bench = false

[dependencies]
tpt-sci-ode = { workspace = true }
tpt-sci-grid = { workspace = true }
tpt-math-linalg = { workspace = true }
thiserror = { workspace = true }

# Optional (de)serialization of result types.
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1"
criterion = { workspace = true }
# For the multi-scale cookbook example (reaction network -> sim-core coupling).
tpt-sci-reaction-network = { version = "0.1.0", path = "../tpt-sci-reaction-network" }
approx = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[[bench]]
name = "sim_core"
harness = false

[features]
# serde (de)serialization for result types. Off by default.
serde = ["dep:serde"]

[[test]]
name = "serde_roundtrip"
required-features = ["serde"]
