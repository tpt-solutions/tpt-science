[package]
name = "tpt-sci-electrophys"
description = "Cardiac electrophysiology (Hodgkin-Huxley, bidomain) for the tpt-science pillar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/tpt-sci-electrophys"
keywords = ["electrophysiology", "hodgkin-huxley", "bidomain", "cardiac", "science"]
categories = ["science", "simulation"]
publish = false

[lib]
bench = false

[dependencies]
tpt-sci-ode = { workspace = true }
tpt-sci-grid = { workspace = true, features = ["sparse"] }
tpt-math-linalg = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
approx = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[[bench]]
name = "electrophys"
harness = false
